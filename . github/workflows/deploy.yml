name: Build and Deploy Italy Address Map

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: italy-address-map-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Download and process address data
        run: |
          python scripts/build_italy_addresses.py

      - name: Prepare website
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp build/stats.json site/data/stats.json

      - name: Generate Italy address PMTiles
        run: |
          ARGS=(
            -o site/data/italy-addresses.pmtiles
            -Z 5
            -z 18
            --drop-densest-as-needed
            --extend-zooms-if-still-dropping
            -L anncsu:build/anncsu.geojsonl
          )

          if [ -s build/osm.geojsonl ]; then
            ARGS+=(-L osm:build/osm.geojsonl)
          fi

          tippecanoe "${ARGS[@]}"

      - name: Check generated data size
        run: |
          ls -lh site/data/
          SIZE=$(stat -c%s site/data/italy-addresses.pmtiles)

          echo "PMTiles size: $SIZE bytes"

          if [ "$SIZE" -gt 900000000 ]; then
            echo "The tile archive is too large for this deployment plan."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
