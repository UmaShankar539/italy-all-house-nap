<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Italy All-House Address Map</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
    }

    header {
      height: 64px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      box-shadow: 0 2px 8px #0002;
      position: relative;
      z-index: 2;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
      color: #173b32;
    }

    .subtitle {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }

    #search {
      display: flex;
      gap: 6px;
      max-width: 430px;
      width: 55%;
    }

    #coordinates {
      width: 100%;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    button {
      padding: 10px 13px;
      border: 0;
      border-radius: 7px;
      background: #176b50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #map {
      width: 100%;
      height: calc(100vh - 64px);
    }

    .panel {
      position: absolute;
      z-index: 1;
      top: 78px;
      left: 12px;
      width: 220px;
      padding: 13px;
      background: white;
      border-radius: 9px;
      box-shadow: 0 2px 10px #0003;
      font-size: 13px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .green { background: #13a65b; }
    .blue { background: #2878dc; }

    #status {
      color: #666;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .maplibregl-popup-content {
      border-radius: 9px;
      min-width: 210px;
      font-size: 13px;
    }

    .popup-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    @media(max-width:600px) {
      header {
        height: auto;
        min-height: 110px;
        align-items: flex-start;
        flex-direction: column;
      }

      #search { width: 100%; max-width: none; }

      #map { height: calc(100vh - 110px); }

      .panel {
        top: 125px;
        width: 180px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <div class="brand">Italy All-House Address Map</div>
    <div class="subtitle">Italy-wide civic address explorer</div>
  </div>

  <div id="search">
    <input
      id="coordinates"
      placeholder="Enter latitude, longitude"
      type="text"
    >
    <button onclick="goToCoordinates()">GO</button>
  </div>
</header>

<div id="map"></div>

<div class="panel">
  <b>Address sources</b>

  <div class="legend">
    <span class="dot green"></span>
    Official ANNCSU
  </div>

  <div class="legend">
    <span class="dot blue"></span>
    OpenStreetMap
  </div>

  <hr>

  <label>
    <input type="checkbox" id="annToggle" checked>
    Show ANNCSU
  </label>

  <br><br>

  <label>
    <input type="checkbox" id="osmToggle" checked>
    Show OSM
  </label>

  <div id="status">
    Loading map. Address tiles appear after the GitHub Actions build completes.
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>

<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [12.5, 42.5],
    zoom: 5,
    minZoom: 4,
    maxZoom: 20
  });

  map.addControl(new maplibregl.NavigationControl(), "top-right");
  map.addControl(new maplibregl.ScaleControl(), "bottom-right");

  function safeText(value) {
    return String(value || "Not available");
  }

  function showPopup(feature, coordinates) {
    const p = feature.properties || {};

    const source =
      p.source === "ANNCSU" ? "Official ANNCSU" : "OpenStreetMap";

    const title = safeText(p.number);

    const content = document.createElement("div");

    const heading = document.createElement("div");
    heading.className = "popup-title";
    heading.textContent = title;

    const fields = [
      ["Street", p.street],
      ["Municipality", p.city],
      ["Postcode", p.postcode],
      ["Source", source],
      ["Accuracy method", p.method],
      ["Latitude", coordinates.lat.toFixed(7)],
      ["Longitude", coordinates.lng.toFixed(7)]
    ];

    content.appendChild(heading);

    fields.forEach(([label, value]) => {
      const line = document.createElement("div");
      line.textContent = label + ": " + safeText(value);
      content.appendChild(line);
    });

    new maplibregl.Popup()
      .setLngLat(coordinates)
      .setDOMContent(content)
      .addTo(map);
  }

  map.on("load", () => {
    const tileUrl = new URL(
      "data/italy-addresses.pmtiles",
      window.location.href
    ).href;

    map.addSource("italy-addresses", {
      type: "vector",
      url: "pmtiles://" + tileUrl
    });

    map.addLayer({
      id: "anncsu-points",
      type: "circle",
      source: "italy-addresses",
      "source-layer": "anncsu",
      minzoom: 9,
      paint: {
        "circle-radius": [
          "interpolate", ["linear"], ["zoom"],
          9, 1.5,
          16, 4
        ],
        "circle-color": "#13a65b",
        "circle-stroke-color": "#ffffff",
        "circle-stroke-width": 0.6
      }
    });

    map.addLayer({
      id: "osm-points",
      type: "circle",
      source: "italy-addresses",
      "source-layer": "osm",
      minzoom: 9,
      paint: {
        "circle-radius": [
          "interpolate", ["linear"], ["zoom"],
          9, 1.5,
          16, 4
        ],
        "circle-color": "#2878dc",
        "circle-stroke-color": "#ffffff",
        "circle-stroke-width": 0.6
      }
    });

    map.addLayer({
      id: "anncsu-labels",
      type: "symbol",
      source: "italy-addresses",
      "source-layer": "anncsu",
      minzoom: 16,
      layout: {
        "text-field": ["get", "number"],
        "text-size": 11,
        "text-font": ["Noto Sans Regular"],
        "text-offset": [0, 1.1],
        "text-allow-overlap": false
      },
      paint: {
        "text-color": "#087b3d",
        "text-halo-color": "#ffffff",
        "text-halo-width": 1.5
      }
    });

    map.addLayer({
      id: "osm-labels",
      type: "symbol",
      source: "italy-addresses",
      "source-layer": "osm",
      minzoom: 16,
      layout: {
        "text-field": ["get", "number"],
        "text-size": 11,
        "text-font": ["Noto Sans Regular"],
        "text-offset": [0, 1.1],
        "text-allow-overlap": false
      },
      paint: {
        "text-color": "#145cb5",
        "text-halo-color": "#ffffff",
        "text-halo-width": 1.5
      }
    });

    const clickable = [
      "anncsu-points",
      "osm-points"
    ];

    clickable.forEach(layer => {
      map.on("click", layer, event => {
        const feature = event.features[0];

        showPopup(feature, event.lngLat);
      });

      map.on("mouseenter", layer, () => {
        map.getCanvas().style.cursor = "pointer";
      });

      map.on("mouseleave", layer, () => {
        map.getCanvas().style.cursor = "";
      });
    });

    document.getElementById("status").textContent =
      "Map ready. Zoom in to see available civic numbers.";
  });

  function setVisibility(layer, visible) {
    if (map.getLayer(layer)) {
      map.setLayoutProperty(
        layer,
        "visibility",
        visible ? "visible" : "none"
      );
    }
  }

  document.getElementById("annToggle").addEventListener("change", e => {
    setVisibility("anncsu-points", e.target.checked);
    setVisibility("anncsu-labels", e.target.checked);
  });

  document.getElementById("osmToggle").addEventListener("change", e => {
    setVisibility("osm-points", e.target.checked);
    setVisibility("osm-labels", e.target.checked);
  });

  function goToCoordinates() {
    const value = document.getElementById("coordinates").value.trim();

    const match = value.match(
      /(-?\d{1,2}(?:\.\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:\.\d+)?)/
    );

    if (!match) {
      alert("Enter coordinates as latitude, longitude. Example: 42.12345, 13.12345");
      return;
    }

    const lat = Number(match[1]);
    const lon = Number(match[2]);

    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon) ||
      lat < -90 || lat > 90 ||
      lon < -180 || lon > 180
    ) {
      alert("Invalid coordinates.");
      return;
    }

    map.flyTo({
      center: [lon, lat],
      zoom: 18,
      speed: 1.2
    });
  }

  document.getElementById("coordinates").addEventListener("keydown", e => {
    if (e.key === "Enter") goToCoordinates();
  });
</script>

</body>
</html>
